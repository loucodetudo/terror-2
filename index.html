<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiência de Terror</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="overlay"></div>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="flash" aria-hidden="true"></div>
    <div id="whisper" class="hidden" aria-live="polite"></div>

    <main id="content">
      <h1>Você não devia estar aqui…</h1>
      <p>
        Se você está lendo isto, já é tarde demais. Clique no botão para ver o
        que está escondido nas sombras.
      </p>
      <button id="startBtn">Entrar</button>

      <div id="messageContainer" class="hidden">
        <p id="message"></p>
      </div>
    </main>

    <audio id="audio" preload="auto" src="beep.wav"></audio>

    <script src="script.js"></script>
  </body>
</html>
